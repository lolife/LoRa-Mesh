[platformio]
default_envs =  receiver
                sender

[env]
platform = espressif32
framework = arduino
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_MODE=1
    -O3
lib_deps = 
    MeshProtocol=symlink://../MeshProtocol
    m5stack/M5Unified
    m5stack/M5GFX
    m5stack/M5-SX127x
    knolleary/PubSubClient
    bblanchon/ArduinoJson

[env:sender]
board = m5stack-cores3
build_flags = 
    -DCORE2
    -DSENDER 
    -DENV3
    -DLIGHT_SENSOR=1
    ${env.build_flags}
lib_deps = 
    ${env.lib_deps}
    tinyu-zhao/TinyGPSPlus-ESP32
    m5stack/M5UnitUnified
    m5stack/M5Unit-ENV
	m5stack/M5Unit-TOF@^0.2.0
upload_protocol = espota
upload_port = 192.168.1.12
monitor_port = /dev/cu.usbmodem2101
;upload_port = ${env:sender.monitor_port}

[env:receiver]
;board = m5stack-core-esp32
board = m5stack-cores3
build_flags = 
    -DCORE3
    -DRECEIVER
    -DARDUINO_M5STACK_CORES3
    ${env.build_flags}
lib_deps = 
    ${env.lib_deps}

upload_protocol = espota
upload_port = 192.168.1.20
monitor_port = /dev/cu.usbmodem21301
;upload_port = ${env:receiver.monitor_port}

; Optional GPS-only sender firmware (no light): pio run -e sender-gps
[env:sender-gps]
extends = env:sender
build_flags =
    -DCORE2
    -DSENDER
    -DENV3
    -DLIGHT_SENSOR=0
    ${env.build_flags}
