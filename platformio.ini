[platformio]
default_envs =  receiver
                sender

[radio]
; Change this ONE line for both sender and receiver, then rebuild both.
; Options: LORA_PROFILE_SF9_125, LORA_PROFILE_SF7_125, LORA_PROFILE_SF7_250
profile = LORA_PROFILE_SF9_125

[photos]
; Shared by sender and receiver: 0 disables photos, 1 enables the experiment.
enabled = 0

[env]
platform = espressif32
framework = arduino
extra_scripts = pre:scripts/build_stamp.py
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_filters = direct
build_flags = 
    -DENABLE_PHOTOS=${photos.enabled}
    -DLORA_PROFILE=${radio.profile}
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
	-DCORE_DEBUG_LEVEL=3
	-DARDUINO_USB_MODE=1
    -O3
lib_deps = 
    MeshProtocol=symlink://../MeshProtocol
    m5stack/M5Unified
    m5stack/M5GFX
    m5stack/M5-SX127x
    knolleary/PubSubClient
    bblanchon/ArduinoJson

[env:sender]
board = m5stack-cores3
build_flags = 
    -DCORE2
    -DSENDER 
    -DENV3
    -DLIGHT_SENSOR=1
    ${env.build_flags}
lib_deps = 
    ${env.lib_deps}
    tinyu-zhao/TinyGPSPlus-ESP32
    m5stack/M5UnitUnified
    m5stack/M5Unit-ENV
	m5stack/M5Unit-TOF@^0.2.0
upload_protocol = espota
upload_port = 192.168.1.12
; Sender MAC F4:12:FA:BA:1A:10. Recheck MAC before USB flashing: port paths can move.
; Sender currently OTA-only; no USB monitor port is assigned.

[env:receiver]
;board = m5stack-core-esp32
board = m5stack-cores3
build_flags = 
    -DCORE3
    -DRECEIVER
    -DARDUINO_M5STACK_CORES3
    ${env.build_flags}
lib_deps = 
    ${env.lib_deps}

;upload_protocol = espota
;upload_port = 192.168.1.20
; Receiver MAC 30:ED:A0:D4:BC:08. Recheck MAC before USB flashing: port paths can move.
monitor_port = /dev/cu.usbmodem212201
upload_port = ${env:receiver.monitor_port}
